<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe6ff" />
      <stop offset="50%" stop-color="#e0f4ff" />
      <stop offset="100%" stop-color="#c8f2dc" />
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b3a55" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="170" fill="#ffffff" filter="url(#sh)" opacity="0.95" />
  <!-- Cheerful sunflower / learning character -->
  <g transform="translate(256, 256) scale(1.6)">
    <!-- Petals -->
    <g fill="#ffc93c">
      <circle cx="0" cy="-60" r="18" />
      <circle cx="42" cy="-42" r="18" />
      <circle cx="60" cy="0" r="18" />
      <circle cx="42" cy="42" r="18" />
      <circle cx="0" cy="60" r="18" />
      <circle cx="-42" cy="42" r="18" />
      <circle cx="-60" cy="0" r="18" />
      <circle cx="-42" cy="-42" r="18" />
    </g>
    <!-- Center disk -->
    <circle cx="0" cy="0" r="46" fill="#8d5b24" />
    <!-- Smiling face -->
    <circle cx="-14" cy="-8" r="5" fill="#ffffff" />
    <circle cx="14" cy="-8" r="5" fill="#ffffff" />
    <circle cx="-14" cy="-8" r="3" fill="#2b3a55" />
    <circle cx="14" cy="-8" r="3" fill="#2b3a55" />
    <!-- Cheeks -->
    <circle cx="-24" cy="6" r="7" fill="#ff7b90" opacity="0.6" />
    <circle cx="24" cy="6" r="7" fill="#ff7b90" opacity="0.6" />
    <!-- Mouth -->
    <path d="M -12 8 Q 0 22 12 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- Sprout leaf -->
  <path d="M 320 340 C 370 310 390 260 360 220 C 330 250 310 290 320 340 Z" fill="#48bb78" />
</svg>

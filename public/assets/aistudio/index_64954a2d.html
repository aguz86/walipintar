.opt.bad{background:#ffb3b3!important;animation:sh .3s}
.opt:disabled{cursor:default}
.mon{text-align:center;font-size:48px}.mon span{display:inline-block}
.hit{animation:sh .35s}.heal{animation:pl .5s}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1;min-height:64px;border-radius:18px;background:#e2d6ff;box-shadow:var(--shadow);font-size:clamp(28px,9vw,48px);padding:0}

.lv[aria-pressed=true]{border-color:#6b4fd6;background:#efe8ff}
.ld{max-width:980px;margin:8px auto 0;padding:0 18px;font-size:clamp(14px,3.8vw,16px);text-align:center;opacity:.85}
.how{background:#fff;border-radius:24px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.gi{height:60px;border:3px solid #cfe6ff;border-radius:18px;text-align:center;font:inherit;font-size:24px;width:140px;margin:0 auto;-webkit-user-select:text;user-select:text}
.act{background:#fff3b0;border-radius:18px;padding:10px 14px;margin:0;font-size:clamp(15px,4vw,18px)}
.tm{margin:0;font-size:14px;opacity:.7}
.how h2{margin:6px 0}.how p{margin:8px 0;font-size:clamp(17px,4.6vw,22px);line-height:1.5}

function limit(){inG=0;clr();$.innerHTML=`<section class="play res"><div class="big">🌙</div><h2>${t('limT')}</h2><p>${t('limP')}</p><p class="act">${t('offl')}</p><button class="opt" style="--c:var(--blue)" data-a="home">🏠 ${t('home')}</button><button class="ghost" data-a="more">👨‍👩‍👧 ${t('parent')}</button></section>`}
function ask(cb){inG=0;clr();const a=R(6,9),b=R(6,9);
$.innerHTML=`<section class="play res"><div class="big">🔒</div><h2>${t('parent')}</h2><p>${t('gq')} <b>${a} × ${b} = ?</b></p><input id="ga" class="gi" inputmode="numeric" maxlength="3" autocomplete="off"><p id="ge"></p><div class="row"><button class="opt" style="--c:var(--blue)" data-a="home">⬅️ ${t('back')}</button><button class="opt" style="--c:var(--mint)" data-a="gk">OK</button></div></section>`;
H=(x,d)=>{if(d.a==='gk'){if(+E('ga').value===a*b)cb();else E('ge').textContent=t('gw')}}}
function par(){inG=0;clr();$.innerHTML=`<section class="play"><div class="how"><h2>👨‍👩‍👧 ${t('parent')}</h2><p>${usage()}</p><p>📚 ${t('bank')} ${D.age||'-'}: 🐾${cp(AN).length} 🍎${cp(FR,2).length} 🥕${cp(VG,2).length} 🌻${cp(TUM).length} 🚗${cp(KD).length}</p><div class="row"><button class="opt" style="--c:var(--blue)" data-a="test">🔊 ${t('testS')}</button></div><p id="vi"></p><p>${t('limset')}</p><div class="row">${[15,30,45,60].map(m=>`<button class="opt" style="--c:${m===D.lim?'#8fe3b0':'#fff'}" data-a="lim" data-l="${m}">${m}</button>`).join('')}</div><p>${t('ptip')}</p></div><button class="opt" style="--c:var(--blue)" data-a="home">🏠 ${t('home')}</button></section>`}
const CATS=[['🐾','Hewan','Animals',()=>AN],['🍎','Buah','Fruits',()=>FR],['🥕','Sayur','Veggies',()=>VG],['🌻','Tumbuhan','Plants',()=>TUM],['🚗','Kendaraan','Vehicles',()=>KD]];
let LC=0,VS=[];
const lvv=()=>{try{VS=speechSynthesis.getVoices()||[]}catch(e){}};lvv();try{speechSynthesis.onvoiceschanged=lvv}catch(e){}
function pv(){const l=D.lang==='id'?'id':'en',c=VS.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(l)||(l==='id'&&/indonesia/i.test(v.name)));if(!c.length)return null;
const m=/andika|ardi|\bmale\b|laki|pria/i,f=/female|perempuan|wanita|gadis|damayanti|google|indah|siti|sari|samantha|karen|zira/i;return c.map(v=>[(f.test(v.name)?3:0)-(m.test(v.name)?5:0)+(v.default?.5:0),v]).sort((a,b)=>b[0]-a[0])[0][1]}
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:12px;right:12px;bottom:16px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)};
function say(txt,cb){let d=0;const f=()=>{if(!d){d=1;cb&&cb()}};if(D.mute||!('speechSynthesis' in window)){setTimeout(f,900);return}
try{lvv();const u=new SpeechSynthesisUtterance(txt),v=pv();u.lang=D.lang==='id'?'id-ID':'en-US';if(v){u.voice=v;u.lang=v.lang}else if(!say.w){say.w=1;toast(t('novoice'))}
u.pitch=1.3;u.rate=.95;u.onend=f;u.onerror=f;speechSynthesis.cancel();setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){f()}},60);setTimeout(f,7000)}catch(e){f()}}
function testSnd(){unlock();unlock2();SFX.ding();setTimeout(()=>playAnimal('🐱'),500);setTimeout(()=>{const v=pv();say(D.lang==='id'?'Halo! Suara petunjuk berfungsi dengan baik.':'Hello! The voice works well.');E('vi').textContent='🔈 '+(v?v.name+' ('+v.lang+')':t('novoice'))},1800)}
function lib(){inG=0;clr();const i=li()-1,A=CATS[LC][3](),n=cp(A).length;
$.innerHTML=`<div class="bar"><button class="back" data-a="home" aria-label="${t('back')}">⬅️</button><b>📚 ${t('lib')}</b><span class="pill">${Math.min(n,A.length)}/${A.length}</span></div><div class="lvl" style="grid-template-columns:repeat(5,1fr)">${CATS.map((c,j)=>`<button class="lv" data-c="${j}" aria-pressed="${j===LC}">${c[0]}<small>${c[i+1]}</small></button>`).join('')}</div><section class="play"><div class="mgrid" style="grid-template-columns:repeat(auto-fill,minmax(86px,1fr))">${A.map((x,k)=>k<n?`<button class="mc up" style="aspect-ratio:auto;min-height:92px;font-size:34px" data-k="${k}">${x[0]==='~'?'📖':x[0]}<small style="display:block;font-size:12px">${x[i+1]}</small></button>`:`<button class="mc" style="min-height:92px" disabled>🔒</button>`).join('')}</div><p class="ld">${n<A.length?t('more'):''}</p></section>`;
H=(b,d)=>{if(d.c!==undefined){LC=+d.c;return lib()}if(d.k!==undefined)item(A[+d.k])}}
function item(x){const i=li()-1,f=fact(x[0])||t(x[0]==='~'?'ask1':'ask2').replace('{n}',x[i+1]);
$.innerHTML=`<div class="bar"><button class="back" data-a="lib" aria-label="${t('back')}">⬅️</button><b>${x[i+1]}</b><span class="pill">📚</span></div><section class="play"><div class="how"><div class="big" style="font-size:96px">${x[0]==='~'?'📖':x[0]}</div><h2>${x[i+1]}</h2><p>${x[i?1:2]}</p><p>${f}</p></div><div class="row">${VX[x[0]]?`<button class="opt" style="--c:#ffd1e3" data-a="s1">🔊 ${t('hear')}</button>`:''}<button class="opt" style="--c:var(--blue)" data-a="s2">🔈 ${t('listen')}</button></div></section>`;
H=(b,d)=>{if(d.a==='s1')playAnimal(x[0]);if(d.a==='s2')say(x[i+1]+'. '+f)}}
const AV=()=>D.gender==='m'?'👦':D.gender==='f'?'👧':'🧒';
function fav(){try{let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}
l.href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="${D.gender==='f'?'#ffd1e3':D.gender==='m'?'#cfe6ff':'#c8f2dc'}"/><text x="50" y="74" font-size="70" text-anchor="middle">${AV()}</text></svg>`)}catch(e){}}
let inP=0;
const sn=()=>{const n=E('nm');if(n)D.name=(n.value||'').trim().slice(0,14)};
function prof(){inG=0;inP=1;clr();const i=li()-1,a=D.age,A=a&&AGE[a];
$.innerHTML=`<section class="play res"><div class="big">${D.gender?AV():'🌻'}</div><h2>${t('wel')}</h2><p><b>1.</b> ${t('age')}</p><div class="row">${[3,4,5,6,7,8].map(n=>`<button class="opt" style="--c:${n===a?'#8fe3b0':'#fff'}" data-age="${n}">${n}</button>`).join('')}</div>${a?`<p><b>2.</b> ${t('gender')}</p><div class="row">${[['m','👦',t('boy')],['f','👧',t('girl')]].map(s=>`<button class="opt" style="--c:${s[0]===D.gender?'#8fe3b0':'#fff'}" data-sx="${s[0]}">${s[1]} ${s[2]}</button>`).join('')}</div><p class="act">🎯 ${t('auto')}: <b>${LV[A.lv].k[i]}</b>. ${LV[A.lv].d[i]}</p><p><b>3.</b> ${t('level')}</p><div class="lvl">${LV.map((v,j)=>`<button class="lv" data-lv="${j}" aria-pressed="${j===D.lv}">${v.e} ${v.n[i]}${j===A.lv?' ⭐':''}<small>${v.a} ${t('yrs')}</small></button>`).join('')}</div><p><b>4.</b> ${t('name')}</p><input id="nm" class="gi" style="width:min(100%,320px)" maxlength="14" placeholder="${t('nph')}" autocomplete="off"><button class="opt" data-a="enter" style="--c:var(--mint)">▶️ ${t('go')}</button>`:''}</section>`;
if(E('nm'))E('nm').value=D.name||''}
function home(){clr();inG=0;inP=0;document.documentElement.lang=D.lang;document.title=t('title');
const i=li()-1,L=LV[D.lv],tot=Object.values(D.best).reduce((a,b)=>a+b,0),st=tot<8?'🌱':tot<24?'🌷':tot<48?'🌻':'🌳';
$.innerHTML=`<header><h1>${st} ${t('title')}</h1><div class="tools"><button data-a="lang" aria-label="Language">🌐 ${D.lang.toUpperCase()}</button><button data-a="snd" aria-label="Sound">${D.mute?'🔇':'🔊'}</button><button data-a="par" aria-label="Parent">👨‍👩‍👧</button><button data-a="prof" aria-label="Profile">${AV()} ${D.name||''} ${D.age||''}</button><span class="pill">⭐ ${tot}</span></div></header>
<div class="lvl" role="group" aria-label="${t('level')}">${LV.map((v,j)=>`<button class="lv" data-lv="${j}" aria-pressed="${j===D.lv}">${v.e} ${v.n[i]}<small>${v.a} ${t('yrs')} · ${v.s[i]}</small></button>`).join('')}</div>
<p class="ld"><b>${L.k[i]}:</b> ${L.d[i]}<br>${usage()}</p>
<main class="grid"><button class="card" style="--c:#fff3b0" data-a="lib"><span class="em">📚</span><span>${t('lib')}</span><small>${[AN,FR,VG,TUM,KD].map(A=>Math.min(cp(A).length,A.length)).reduce((a,b)=>a+b)}/${[AN,FR,VG,TUM,KD].map(A=>A.length).reduce((a,b)=>a+b)}</small></button>${G.map(g=>`<button class="card" style="--c:${g.c}" data-g="${g.id}"><span class="em">${g.e}</span><span>${g.n[i]}</span><small>${SK[g.id][0]} ${SK[g.id][i+1]}</small><em class="bs">${'⭐'.repeat(D.best[g.id+D.lv]||0)}</em></button>`).join('')}</main>`}
function info(id){cur=id;clr();inG=0;const g=G.find(x=>x.id===id),L=LV[D.lv],i=li()-1;
$.innerHTML=bar(g,`${L.e} ${L.n[i]}`)+`<section class="play"><div class="how"><div class="em" style="font-size:64px">${g.e}</div><h2>${t('how')}</h2><p>${HOW[id][i]}</p><p><b>${L.k[i]}</b> (${L.a} ${t('yrs')}): ${L.d[i]}</p><p>🧠 ${t('train')}: ${SK[id][i+1]}</p>${FACT[id]?`<p class="act">💡 ${t('fact')} ${FACT[id][i]}</p>`:''}</div><div class="row"><button class="opt" style="--c:var(--blue)" data-a="say">🔈 ${t('listen')}</button><button class="opt" style="--c:var(--mint)" data-a="play">▶️ ${t('go')}</button></div></section>`}
function start(id){cur=id;clr();if(gate())return;inG=1;const g=G.find(x=>x.id===id),v=D.lv,f={memory:mem,bubbles:bub,order:ord}[id];
f?f(g):(Q={i:0,n:[6,8,10][v],mis:0,hp:[3,4,5][v],max:[3,4,5][v],bad:0},nq(g))}
function fin(g,s,extra=''){clr();SFX.win();const k=g.id+D.lv;D.best[k]=Math.max(D.best[k]||0,s);save();
$.innerHTML=`<section class="play res"><div class="big">🎉</div><h2>${D.name?t('done').replace('!',', '+D.name+'!'):t('done')}</h2><div class="big">${'⭐'.repeat(s)}</div><p>${extra}</p><p class="act">🌟 ${ACT[g.id][li()-1]}</p><p class="tm">${usage()}</p><div class="row"><button class="opt" style="--c:var(--mint)" data-a="again">🔁 ${t('again')}</button><button class="opt" style="--c:var(--blue)" data-a="home">🏠 ${t('home')}</button></div></section>`}
// ---------- game kuis ----------
const hearts=()=>`👾 ${'❤️'.repeat(Q.hp)}${'🤍'.repeat(Q.max-Q.hp)}`;
function nq(g){const m=g.id==='monster',x=GEN[g.id]();Q.bad=0;
$.innerHTML=bar(g,m?hearts():`${Q.i+1}/${Q.n}`)+`<section class="play"><p class="ask">${x.ask}</p>${m?'<div class="mon" id="mon">🦸 ⚔️ <span>👾</span></div>':''}<div class="q${x.s?' sm':''}">${x.q}</div>${x.snd?`<button class="ghost" data-a="s1">🔊 ${t('hear')}</button>`:''}<p class="fb" id="fb">&nbsp;</p><div class="opts">${x.o.map((v,i)=>`<button class="opt" style="--c:${PAL[i%6]}" data-v="${v}">${v}</button>`).join('')}</div></section>`;
if(x.snd)after(()=>playAnimal(x.snd),500);const fx=c=>{const s=document.querySelector('#mon span');s.classList.remove('hit','heal');void s.offsetWidth;s.classList.add(c)};
H=(b,d)=>{if(d.a==='s1')return playAnimal(x.snd);if(d.v===undefined)return;const f=E('fb');
if(d.v===String(x.a)){D.xp=(D.xp||0)+1;save();document.querySelectorAll('.opt').forEach(o=>o.disabled=true);b.classList.add('good');f.textContent='🌟 '+P(t('ok'));
if(m){SFX.hit();Q.hp--;E('hp').textContent=hearts();fx('hit')}else{SFX.ding();setTimeout(()=>{x.snd?playAnimal(x.snd,()=>x.say&&say(x.say)):x.say&&say(x.say)},350)}
Q.i++;after(()=>{(m?Q.hp<=0:Q.i>=Q.n)?fin(g,stq(Q.mis),m?t('win'):''):nq(g)},x.say?2600:850)}
else{b.disabled=true;b.classList.add('bad');f.textContent=t('no');if(!Q.bad){Q.bad=1;Q.mis++}
if(m){SFX.heal();Q.hp=Math.min(Q.max,Q.hp+1);E('hp').textContent=hearts();fx('heal')}else SFX.no()}}}
// ---------- kartu kembar ----------
function mem(g){const v=D.lv,pr=[3,4,6][v],e=S(cp(AN)).slice(0,pr).map(a=>a[0]),c=S([...e,...e]);let f=[],ok=0,mv=0,lock=0;
$.innerHTML=bar(g,`${t('moves')}: 0`)+`<section class="play"><div class="mgrid" style="grid-template-columns:repeat(${pr===3?3:4},1fr)">${c.map((_,i)=>`<button class="mc" data-i="${i}">❓</button>`).join('')}</div></section>`;
H=(b,d)=>{if(d.i===undefined||lock||b.classList.contains('up'))return;b.classList.add('up');b.textContent=c[d.i];SFX.bloop();f.push(b);
if(f.length===2){mv++;E('hp').textContent=`${t('moves')}: ${mv}`;const[a,z]=f;
if(c[a.dataset.i]===c[z.dataset.i]){SFX.ding();a.classList.add('ok');z.classList.add('ok');f=[];if(++ok===pr)after(()=>fin(g,mv<=pr+2?3:mv<=pr*2?2:1,`${t('moves')}: ${mv}`),600)}
else{lock=1;after(()=>{[a,z].forEach(x=>{x.classList.remove('up');x.textContent='❓'});f=[];lock=0},800)}}}}
// ---------- pecah gelembung ----------
function bub(g){const v=D.lv,sp=[[80,100],[50,80],[40,60]][v],iv=[900,650,520][v],sz=[88,70,60][v],th=[[8,5],[15,9],[20,12]][v];let s=0,left=25;
$.innerHTML=bar(g,`⏱ <span id="tl">25</span> 🫧 <span id="sc">0</span>`)+`<section class="play"><div class="sky" id="sky"></div></section>`;
const sky=E('sky');
H=b=>{if(!b.classList.contains('bb'))return;SFX.bloop();b.remove();E('sc').textContent=++s};
tm.push(setInterval(()=>{const b=document.createElement('button');b.className='bb';b.textContent=P(AN)[0];b.style.cssText=`left:${R(2,76)}%;width:${sz}px;height:${sz}px;font-size:${sz/2}px;animation-duration:${R(sp[0],sp[1])/10}s;--c:${P(PAL)}`;b.onanimationend=()=>b.remove();sky.appendChild(b)},iv));
tm.push(setInterval(()=>{E('tl').textContent=--left;if(left<=0)fin(g,s>=th[0]?3:s>=th[1]?2:1,`🫧 ${s}`)},1000))}
// ---------- urutkan angka ----------
function ord(g){const L=[[3,4,5],[5,7,9],[8,10,12]][D.lv];let r=0,mis=0,nx=1;
const draw=()=>{nx=1;$.innerHTML=bar(g,`${r+1}/3`)+`<section class="play"><p class="ask">${t('tap')}</p><div class="opts s">${S(num(L[r])).map((v,i)=>`<button class="opt" style="--c:${PAL[i%6]}" data-n="${v}">${v}</button>`).join('')}</div></section>`};
draw();
H=(b,d)=>{if(!d.n)return;if(+d.n===nx){SFX.bloop();b.classList.add('good');b.disabled=true;
if(++nx>L[r]){SFX.ding();if(++r>=3)after(()=>fin(g,stq(mis)),500);else after(draw,700)}}else{SFX.no();mis++}}}
// ---------- mulai & PWA ----------
fav();D.age?home():prof();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

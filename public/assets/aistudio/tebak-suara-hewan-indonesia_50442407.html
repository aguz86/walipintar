<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe3ee">
<title>Tebak Suara Hewan Indonesia</title>
<style>
:root{--ink:#4a3b5c;--mute:#8a7d99;--sh:rgba(110,80,140,.22);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;font-weight:800;color:var(--ink);
background:radial-gradient(circle at 12% 8%,#fff3b8 0,transparent 34%),radial-gradient(circle at 92% 92%,#cfe8ff 0,transparent 40%),linear-gradient(160deg,#ffe3ee,#e8f6ff 60%,#e6fbef);
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid #8b6fd6;outline-offset:2px}
.scr{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2dvh;padding:1.5dvh 16px;max-width:560px;margin:0 auto;text-align:center}
.scr.on{display:flex}
h1{margin:0;font-size:min(8.6vw,5.2dvh);line-height:1.1}h2{margin:0;font-size:min(8.6vw,5dvh)}p{margin:0;font-size:min(4.6vw,2.8dvh)}
.logo{font-size:min(16vw,9dvh)}
#nm{width:100%;max-width:360px;height:max(56px,7dvh);border:3px solid #fff;border-radius:22px;background:#fffdfb;text-align:center;font-size:20px;box-shadow:0 6px 16px var(--sh);-webkit-user-select:text;user-select:text}
.ages{display:flex;gap:10px;width:100%;max-width:360px}
.age{flex:1;min-height:max(56px,7dvh);border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(90,60,120,.15);font-size:min(4.6vw,2.8dvh);border:3px solid transparent}
.age[aria-pressed=true]{border-color:#6b4fd6;background:#efe8ff}
.btn{min-height:max(64px,8.5dvh);padding:0 24px;border-radius:26px;background:linear-gradient(#9be3b4,#6fcf97);color:#17492b;font-size:min(6.2vw,3.5dvh);box-shadow:0 7px 0 #4fae78,0 14px 22px var(--sh);width:100%;max-width:360px}
.btn.alt{background:linear-gradient(#cfe6ff,#a9d0ff);color:#1f3f6b;box-shadow:0 7px 0 #7fb0ee,0 14px 22px var(--sh);min-height:max(56px,7dvh);font-size:min(5vw,3dvh)}
.btn:active,.opt:active,.spk:active{transform:translateY(4px)}
.card{background:#fffffff0;border-radius:22px;padding:1.2dvh 22px;box-shadow:0 6px 16px var(--sh);font-size:min(4.6vw,2.8dvh)}
.card b{font-size:min(7vw,4dvh)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.step{background:#fff;border-radius:24px;padding:1.6dvh 8px;box-shadow:0 6px 16px var(--sh);font-size:min(4.2vw,2.5dvh);line-height:1.25}
.step span{display:block;font-size:min(14vw,8dvh)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.chip{padding:0 12px;min-height:46px;display:flex;align-items:center;border-radius:16px;background:#fffffff0;box-shadow:0 4px 10px var(--sh);font-size:min(4.2vw,2.6dvh);white-space:nowrap}
.play{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:2dvh}
.spk{flex:none;width:min(54vw,28dvh);height:min(54vw,28dvh);border-radius:50%;background:linear-gradient(#ffe48a,#ffc94f);box-shadow:0 8px 0 #e0a52c,0 16px 26px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;border:0}
.spk .ic{font-size:min(18vw,9dvh);line-height:1}.spk .lb{font-size:min(3.8vw,2.2dvh);line-height:1.15;color:#6b4a00}
.spk.hint{animation:pu .6s ease-in-out infinite alternate}
.opts{flex:1;min-height:0;width:100%;max-width:520px;display:grid;gap:2dvh;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.opts.n3 .opt:last-child{grid-column:1/-1}
.opt{min-height:64px;min-width:64px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(22vw,11dvh);line-height:1;box-shadow:0 8px 0 rgba(90,60,120,.18),0 14px 22px var(--sh)}
.opt small{font-size:min(4.2vw,2.4dvh);margin-top:.5dvh}
.opt:nth-child(1){background:#ffd3e2}.opt:nth-child(2){background:#cfe8ff}.opt:nth-child(3){background:#c9f1dc}.opt:nth-child(4){background:#fff0b8}
.opt.ok{background:#8fe3b0!important;animation:bo .5s}.opt.bad{background:#ffb8b8!important;animation:sk .4s}.opt:disabled{opacity:.45;cursor:default}
.big{font-size:min(24vw,14dvh);line-height:1}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}#cf[hidden]{display:none}
@keyframes pu{to{transform:scale(1.07)}}@keyframes bo{40%{transform:scale(1.12)}}@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (orientation:landscape) and (max-height:520px){.play{flex-direction:row;align-items:stretch}.spk{align-self:center;width:min(30vw,62dvh);height:min(30vw,62dvh)}.opt{font-size:min(14vw,22dvh)}.opt small{display:none}}
@media (prefers-reduced-motion:reduce){.spk.hint,.opt.ok,.opt.bad{animation:none}}
</style>
</head>
<body>

<!-- SCREEN 1: SETUP -->
<section id="s1" class="scr on">
  <div class="logo" aria-hidden="true">🐱🐶🐮</div>
  <h1>Tebak Suara Hewan Indonesia</h1>
  <input id="nm" maxlength="14" placeholder="Tulis namamu" autocomplete="off" autocapitalize="words" enterkeyhint="go" aria-label="Nama">
  <div class="ages" role="group" aria-label="Umur">
    <button class="age" data-a="0">3–4 tahun</button><button class="age" data-a="1">5–6 tahun</button><button class="age" data-a="2">7–8 tahun</button>
  </div>
  <button class="btn" id="go">MULAI BERMAIN ▶️</button>
  <button class="btn alt" id="gd">Panduan Bermain 📖</button>
  <div class="card">🏆 Skor Tertinggi: <b id="hi">0</b></div>
</section>

<!-- SCREEN 2: CARA BERMAIN -->
<section id="s2" class="scr">
  <h2>Cara Bermain</h2>
  <div class="steps">
    <div class="step"><span>🔊</span>1. Tekan tombol speaker</div>
    <div class="step"><span>👂</span>2. Dengarkan suara hewannya</div>
    <div class="step"><span>👆</span>3. Pilih gambar hewan yang cocok</div>
    <div class="step"><span>❤️❤️❤️</span>4. Ada 3 nyawa. Jawab benar, dapat bintang ⭐</div>
  </div>
  <button class="btn" id="ok">Aku Mengerti ✅</button>
</section>

<!-- SCREEN 3: GAMEPLAY -->
<section id="s3" class="scr">
  <div class="hud">
    <div class="chip">👤 <span id="pn"></span></div>
    <div class="chip" id="lv" aria-label="Nyawa"></div>
    <div class="chip">⭐ <span id="sc">0</span> · <span id="prog"></span></div>
  </div>
  <div class="play">
    <button class="spk" id="spk"><span class="ic">🔊</span><span class="lb">Klik untuk dengar suaranya! 🔊</span></button>
    <div class="opts" id="opts"></div>
  </div>
</section>

<!-- SCREEN 4: HASIL -->
<section id="s4" class="scr">
  <div class="big" id="rE">🎉</div>
  <h2 id="rT"></h2>
  <div class="big" id="rS" style="font-size:min(14vw,8dvh)"></div>
  <p id="rP"></p><p id="rH"></p>
  <button class="btn" id="again">Main Lagi 🔁</button>
  <button class="btn alt" id="menu">Menu Utama 🏠</button>
</section>
<canvas id="cf" hidden></canvas>

<script>
// ============ LOGIKA GAME (membaca data dari <script id="audio-data"> di bagian bawah) ============
document.addEventListener('DOMContentLoaded',function(){
'use strict';
var $=function(i){return document.getElementById(i)},R=function(n){return Math.floor(Math.random()*n)},
sh=function(a){return a.map(function(v){return[Math.random(),v]}).sort(function(x,y){return x[0]-y[0]}).map(function(x){return x[1]})};
// Tingkat kesulitan per umur: r = jumlah soal, o = jumlah pilihan, nm = tampilkan nama hewan
var CFG=[{r:6,o:3,nm:1},{r:8,o:4,nm:1},{r:10,o:4,nm:0}],KEY='tsh_idn',P={name:'',age:1,high:0},S={gen:0};
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
var ALL=hewanIndonesia.filter(function(h){return h&&h.emoji&&h.name});
function withSound(){return ALL.filter(function(h){return h.soundBase64})}

// ---------- Audio: satu elemen Audio yang dibuka (unlock) saat sentuhan pertama agar jalan di iOS & Android ----------
var A=new Audio(),AC,SIL='data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQIAAAAAAA==';
function ctx(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}ctx();if(unlock.d)return;unlock.d=1;
  try{A.src=SIL;var p=A.play();if(p&&p.then)p.then(function(){A.pause()}).catch(function(){})}catch(e){}
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
['pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true})});
function tone(f,d,ty,v,t,f2){var c=ctx();if(!c)return;var o=c.createOscillator(),g=c.createGain(),s=c.currentTime+(t||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
function chime(){[1047,1319,1568,2093].forEach(function(f,i){tone(f,.3,'sine',.18,i*.09)})}
function buzz(){tone(160,.3,'sawtooth',.07,0,95)}
function fanfare(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i>5?.7:.25,'triangle',.22,i*.14)})}
function src(s){return s.indexOf('data:')===0?s:'data:audio/mpeg;base64,'+s}
function play(h,cb){var d=0,f=function(){if(!d){d=1;if(cb)cb()}};if(!h||!h.soundBase64){f();return}
  try{A.pause();A.src=src(h.soundBase64);A.onended=f;var p=A.play();if(p&&p.catch)p.catch(f)}catch(e){f()}setTimeout(f,4000)}

// ---------- Text-to-Speech Indonesia (suara perempuan) ----------
var VS=[];function lv(){try{VS=speechSynthesis.getVoices()||[]}catch(e){}}lv();try{speechSynthesis.onvoiceschanged=lv}catch(e){}
function voice(){var c=VS.filter(function(v){return /^id([-_]|$)/i.test(v.lang)||/indonesia/i.test(v.name)});if(!c.length)return null;
  var m=/andika|ardi|\bmale\b|laki|pria/i,f=/female|perempuan|wanita|gadis|damayanti|google|indah|siti|sari/i;
  return c.map(function(v){return[(f.test(v.name)?3:0)-(m.test(v.name)?5:0)+(v['default']?.5:0),v]}).sort(function(a,b){return b[0]-a[0]})[0][1]}
function speak(txt,cb){var d=0,f=function(){if(!d){d=1;if(cb)cb()}};if(!('speechSynthesis' in window)){setTimeout(f,1200);return}
  try{lv();var u=new SpeechSynthesisUtterance(txt),v=voice();u.lang='id-ID';if(v){u.voice=v;u.lang=v.lang}u.pitch=1.35;u.rate=1.02;u.onend=f;u.onerror=f;
    speechSynthesis.cancel();setTimeout(function(){try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){f()}},60);setTimeout(f,5500)}catch(e){f()}}

// ---------- Layar (SPA) ----------
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('on',s.id===id)})}
function chips(){document.querySelectorAll('.age').forEach(function(b,i){b.setAttribute('aria-pressed',String(i===P.age))})}
function home(){S.gen++;try{speechSynthesis.cancel()}catch(e){}$('cf').hidden=true;$('nm').value=P.name;$('hi').textContent=P.high;chips();show('s1')}
function nameOf(){return P.name||'Teman'}
function hud(){$('pn').textContent=nameOf();$('lv').textContent='❤️'.repeat(Math.max(0,S.lives))+'🤍'.repeat(3-Math.max(0,S.lives));$('sc').textContent=S.score}

// ---------- Permainan ----------
function start(){unlock();P.name=$('nm').value.trim().slice(0,14);save();
  if(!withSound().length){alert('Belum ada suara. Isi data audio pada hewanIndonesia di bagian bawah file.');return}
  S={gen:S.gen+1,i:0,score:0,lives:3,last:null,lock:true,c:CFG[P.age]};$('cf').hidden=true;show('s3');hud();next()}
function next(){var c=S.c,w=withSound(),pool=w.length>1?w.filter(function(h){return h!==S.last}):w;S.q=pool[R(pool.length)];S.last=S.q;
  var n=Math.min(c.o,ALL.length),o=sh([S.q].concat(sh(ALL.filter(function(h){return h!==S.q})).slice(0,n-1))),box=$('opts');
  box.className='opts n'+o.length;box.innerHTML='';
  o.forEach(function(h){var b=document.createElement('button'),e=document.createElement('span');b.className='opt';b.setAttribute('aria-label',h.name);e.textContent=h.emoji;b.appendChild(e);
    if(c.nm){var s=document.createElement('small');s.textContent=h.name;b.appendChild(s)}
    b.onclick=function(){answer(h,b)};box.appendChild(b)});
  $('prog').textContent=(S.i+1)+'/'+c.r;S.lock=false;$('spk').classList.add('hint')}
$('spk').onclick=function(){unlock();if(!S.q)return;var g=S.gen;$('spk').classList.remove('hint');speak('Tebak, hewan apa ini?',function(){if(S.gen===g)play(S.q)})};
function answer(h,b){if(S.lock||b.disabled)return;unlock();var g=S.gen;
  if(h===S.q){S.lock=true;b.classList.add('ok');S.score+=10;hud();chime();
    setTimeout(function(){if(S.gen!==g)return;play(S.q,function(){if(S.gen!==g)return;speak('Hebat, '+nameOf()+'! Kamu pintar!',function(){if(S.gen!==g)return;S.i++;S.i>=S.c.r?finish(true):next()})})},350)}
  else{S.lives--;S.lock=true;hud();buzz();b.classList.add('bad');b.disabled=true;
    speak('Ups, coba lagi ya!',function(){if(S.gen!==g)return;if(S.lives<=0)finish(false);else S.lock=false})}}
function finish(win){var stars=win?Math.max(1,S.lives):0,rec=S.score>P.high;if(rec)P.high=S.score;save();
  $('rE').textContent=win?'🎉':'😢';$('rT').textContent=win?'Hebat, '+nameOf()+'!':'Yah, nyawa habis';
  $('rS').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('rP').textContent='Skor: '+S.score;
  $('rH').textContent=rec&&S.score>0?'🏅 Skor tertinggi baru!':'Skor tertinggi: '+P.high;show('s4');
  if(win){confetti();fanfare();speak('Hebat, '+nameOf()+'! Kamu pintar!')}else speak('Jangan sedih, ayo coba lagi ya!')}

// ---------- Konfeti ----------
function confetti(){var c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.hidden=false;
  var cols=['#ff9ec4','#9fd3ff','#8fe3b0','#ffe27a','#c9b3ff','#ffb48a'],ps=[];
  for(var i=0;i<140;i++)ps.push({x:Math.random()*c.width,y:-Math.random()*c.height*.6,r:4+Math.random()*6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[R(6)]});
  var t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(t-t0<4500&&!c.hidden)requestAnimationFrame(f);else c.hidden=true})(t0)}

// ---------- Tombol ----------
document.querySelectorAll('.age').forEach(function(b){b.onclick=function(){P.age=+b.dataset.a;save();chips()}});
$('go').onclick=start;$('nm').onkeydown=function(e){if(e.key==='Enter')start()};
$('gd').onclick=function(){show('s2')};$('ok').onclick=function(){home()};
$('again').onclick=start;$('menu').onclick=home;
document.addEventListener('gesturestart',function(e){e.preventDefault()});
home();
});
</script>

<script id="audio-data">
// ============ DATA HEWAN & AUDIO ============
// Format tiap hewan: { name: "Kucing", emoji: "🐱", soundBase64: "data:audio/mpeg;base64,...." }
// - soundBase64 boleh berupa data URI lengkap (data:audio/...;base64,XXXX) atau Base64 mentah (otomatis dianggap MP3).
// - Hewan dengan soundBase64 kosong ("") hanya muncul sebagai PILIHAN pengecoh, belum menjadi soal.
